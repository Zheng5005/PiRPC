<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pi RPC — Frontend A</title>
<style>
  :root { --accent: #7c8cff; }
  * { box-sizing: border-box; margin: 0; }
  body { font: 15px/1.5 system-ui, sans-serif; background: #14161c; color: #e8eaf0;
         display: flex; flex-direction: column; height: 100vh; }
  header { padding: 10px 16px; background: #1c1f28; border-bottom: 1px solid #2a2e3a;
           display: flex; justify-content: space-between; align-items: center; }
  header b { color: var(--accent); }
  #status { font-size: 12px; padding: 2px 10px; border-radius: 999px; background: #2a2e3a; }
  #status.on { background: #1f3d2b; color: #7ee2a0; }
  #status.busy { background: #3d3520; color: #e2c87e; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 75%; padding: 8px 12px; border-radius: 12px; white-space: pre-wrap; word-break: break-word; }
  .msg a { color: var(--accent); }
  .user { align-self: flex-end; background: var(--accent); color: #14161c; }
  .assistant { align-self: flex-start; background: #232735; }
  .tool, .error, .info { align-self: center; background: none; font-size: 12px; color: #8a90a2; }
  .error { color: #ff8a8a; }
  .stamp { font-size: 11px; color: #666e82; margin-top: -5px; }
  .stamp.user { align-self: flex-end; }
  .stamp.assistant { align-self: flex-start; }
  form { display: flex; gap: 8px; padding: 12px 16px; background: #1c1f28; border-top: 1px solid #2a2e3a; }
  input[type=text] { flex: 1; padding: 10px 12px; border-radius: 8px; border: 1px solid #2a2e3a;
          background: #14161c; color: inherit; }
  input:disabled { opacity: 0.5; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent);
           color: #14161c; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: default; }
  #upload { background: #2a2e3a; color: #e8eaf0; }
</style>
</head>
<body>
<header>
  <b>Pi RPC — Frontend A</b>
  <span id="status">connecting…</span>
</header>
<div id="log"></div>
<form id="form">
  <input type="file" id="file" accept=".doc,.docx" hidden>
  <button type="button" id="upload" title="Upload a Word document">📎</button>
  <input type="text" id="input" autocomplete="off" placeholder="Message Pi…" disabled>
  <button id="send" disabled>Send</button>
</form>

<script>
const log = document.getElementById("log");
const statusEl = document.getElementById("status");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const uploadBtn = document.getElementById("upload");
const fileInput = document.getElementById("file");

let busy = false;          // an agent run is active
let assistantEl = null;    // bubble receiving the streamed text

function add(role, text = "") {
  const el = document.createElement("div");
  el.className = `msg ${role}`;
  el.textContent = text;
  log.append(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function stamp(role, date = new Date()) {
  const el = document.createElement("div");
  el.className = `stamp ${role}`;
  el.textContent = date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  el.title = date.toLocaleString([], { dateStyle: "full", timeStyle: "long" });
  log.append(el);
  log.scrollTop = log.scrollHeight;
}

// Turn /output/<file>.pdf mentions into real download links.
function linkifyDownloads(el) {
  const text = el.textContent;
  const match = text.match(/\/output\/[^\s"'`]+\.pdf/i);
  if (!match) return;
  const [url] = match;
  el.textContent = "";
  const [before, after] = text.split(url, 2);
  el.append(before);
  const a = document.createElement("a");
  a.href = url;
  a.textContent = url;
  a.target = "_blank";
  el.append(a, after ?? "");
}

function setBusy(value) {
  busy = value;
  input.disabled = sendBtn.disabled = value || ws.readyState !== WebSocket.OPEN;
  statusEl.textContent = value ? "working…" : "connected";
  statusEl.className = value ? "busy" : "on";
  if (!value) input.focus();
}

const ws = new WebSocket(`ws://${location.host}/ws`);

ws.onopen = () => { setBusy(false); };
ws.onclose = (e) => {
  input.disabled = sendBtn.disabled = true;
  statusEl.textContent = "disconnected";
  statusEl.className = "";
  add("info", `connection closed${e.reason ? `: ${e.reason}` : ""}`);
};

ws.onmessage = (event) => {
  const rec = JSON.parse(event.data);
  switch (rec.type) {
    case "message_update": {
      const ev = rec.assistantMessageEvent;
      if (ev?.type === "text_delta") {
        assistantEl ??= add("assistant");
        assistantEl.textContent += ev.delta;
        log.scrollTop = log.scrollHeight;
      }
      break;
    }
    case "message_end":
      if (rec.message?.role === "assistant") {
        if (assistantEl) linkifyDownloads(assistantEl);
        stamp("assistant");
        assistantEl = null;
      }
      break;
    case "tool_execution_start":
      add("tool", `⚙ ${rec.toolName}`);
      break;
    case "agent_settled":
      assistantEl = null;
      setBusy(false);
      break;
    case "response":
      if (rec.success === false) {
        add("error", `${rec.command}: ${rec.error}`);
        setBusy(false);
      }
      break;
    case "bridge_error":
      add("error", rec.error);
      break;
  }
};

form.onsubmit = (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  add("user", text);
  stamp("user");
  ws.send(JSON.stringify({ id: crypto.randomUUID(), type: "prompt", message: text }));
  input.value = "";
  setBusy(true);
};

uploadBtn.onclick = () => fileInput.click();
fileInput.onchange = async () => {
  const file = fileInput.files[0];
  fileInput.value = "";
  if (!file) return;
  add("info", `Uploading ${file.name}…`);
  try {
    const res = await fetch(`/upload?name=${encodeURIComponent(file.name)}`, { method: "POST", body: file });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    add("info", `✓ Uploaded ${data.name} — ask Pi to convert it to PDF.`);
  } catch (err) {
    add("error", `Upload failed: ${err.message}`);
  }
};
</script>
</body>
</html>
